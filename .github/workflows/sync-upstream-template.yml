# Upstream Synchronization Workflow
#
# Automatically checks for updates from the three official Econometric Society
# LaTeX templates and creates a pull request when any of them moves.
#
# Schedule: Every Monday at 9 AM UTC
# Manual trigger: Actions tab -> Run workflow
#
# Note on triggering: GitHub cannot fire a workflow here when an upstream repo
# is pushed to, because those repos are owned by vtex-soft and send us no
# events. Polling on a schedule is the only option. The complementary guard is
# the check-upstream-drift job in ci.yml, which runs on every push and pull
# request and fails if a submodule pointer moved without the vendored root
# files being re-synced.
#
# Process:
# 1. Fetch each submodule and check whether its default branch has moved
# 2. Re-vendor the root files via scripts/sync-vendored.sh
# 3. Create one PR covering every submodule that moved
# 4. Label as 'dependencies' and 'automated'
#
# Upstream:
#   https://github.com/vtex-soft/texsupport.econometricsociety-ecta
#   https://github.com/vtex-soft/texsupport.econometricsociety-qe
#   https://github.com/vtex-soft/texsupport.econometricsociety-te

name: Sync Upstream Template Files

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggering

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for upstream updates
        id: check-updates
        run: |
          set -euo pipefail
          moved=""

          for journal in ecta qe te; do
            # Deliberately not named `path`: that is a special PATH-bound array
            # in zsh, so the name is a trap for anyone running this logic
            # outside GitHub's bash.
            dir="original/$journal"

            # Do not assume a branch name: qe tracks main, ecta and te track
            # master, and any of them could change.
            git -C "$dir" fetch --quiet origin
            git -C "$dir" remote set-head origin -a >/dev/null
            branch=$(git -C "$dir" symbolic-ref --short refs/remotes/origin/HEAD | sed 's|^origin/||')

            local_sha=$(git -C "$dir" rev-parse HEAD)
            remote_sha=$(git -C "$dir" rev-parse "origin/$branch")

            if [ "$local_sha" != "$remote_sha" ]; then
              echo "$journal: $local_sha -> $remote_sha (branch $branch)"
              git -C "$dir" checkout --quiet "$remote_sha"
              moved="$moved $journal"
            else
              echo "$journal: up to date"
            fi
          done

          moved=${moved# }
          if [ -n "$moved" ]; then
            echo "updates=true" >> "$GITHUB_OUTPUT"
            echo "moved=$moved" >> "$GITHUB_OUTPUT"
          else
            echo "updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-vendor root files
        if: steps.check-updates.outputs.updates == 'true'
        run: |
          set -euo pipefail

          # Picks the newest econsocart.cls/.cfg across all three submodules and
          # each .bst from its own journal. See scripts/sync-vendored.sh.
          scripts/sync-vendored.sh

          CLASS_VERSION=$(sed -n 's/.*ProvidesClass{econsocart}\[\([^]]*\)\].*/\1/p' econsocart.cls | head -1)
          echo "CLASS_VERSION=$CLASS_VERSION" >> "$GITHUB_ENV"

      - name: Create Pull Request
        if: steps.check-updates.outputs.updates == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync upstream Econometric Society templates"
          title: "Sync upstream templates (${{ steps.check-updates.outputs.moved }})"
          body: |
            ## Automated Update from Upstream

            This PR advances the pinned Econometric Society template submodules
            and re-vendors the root files.

            ### Submodules updated
            `${{ steps.check-updates.outputs.moved }}`

            ### Vendored files
            Re-generated by `scripts/sync-vendored.sh`:

            - `econsocart.cls` / `econsocart.cfg` - shared by all three journals,
              taken from whichever submodule ships the newest release
              (currently `${{ env.CLASS_VERSION }}`)
            - `qe.bst`, `te.bst`, `econsoc.bst` - journal-specific, each from its
              own upstream

            ### Sources
            - https://github.com/vtex-soft/texsupport.econometricsociety-ecta
            - https://github.com/vtex-soft/texsupport.econometricsociety-qe
            - https://github.com/vtex-soft/texsupport.econometricsociety-te

            Please review the changes before merging. The `check-upstream-drift`
            CI job verifies the vendored copies match the new pins.
          branch: update-upstream-template
          delete-branch: true
          labels: |
            dependencies
            automated
