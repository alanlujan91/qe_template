jtex: v1
title: Econometric Society Journals Template
description: >-
  Unofficial MyST Markdown template for Econometric Society journal submissions:
  Econometrica, Quantitative Economics, and Theoretical Economics. Not endorsed
  by The Econometric Society or VTeX; bundles the official econsocart class
  files, which are copyright UAB "VTeX" and licensed LPPL 1.3c
version: 1.0.0
license: CC-BY-4.0
source: https://github.com/alanlujan91/qe_template
thumbnail: ./thumbnail.png
authors:
  - name: Alan Lujan
    website: https://github.com/alanlujan91
tags:
  - paper
  - journal
  - economics
  - econometric-society
  - econometrica
  - quantitative-economics
  - theoretical-economics
doc:
  - id: title
    required: true
    description: Title of the paper
  - id: short_title
    required: true
    description: Running head title
  - id: bibliography
    required: false
    description: Bibliography file (BibTeX .bib file)
  - id: keywords
    required: false
    description: Keywords for the paper (3-8 recommended)
  - id: tags
    required: false
    description: JEL codes/tags for the paper (up to 3 codes in alphabetical order)
  - id: authors
    required: true
    description: List of author objects with name, surname, email, and affiliations
  - id: affiliations
    required: true
    description: List of affiliation objects with id, department, and institution
  - id: open_access
    required: false
    description: Enable the econsocart openaccess class option (set open_access true in frontmatter)
parts:
  - id: abstract
    required: false
    description: Abstract of the paper (max 150 words recommended)
  - id: acknowledgement
    required: false
    description: Acknowledgements and funding information
  - id: appendix
    required: false
    description: Appendix content
options:
  - type: choice
    id: journal
    description: >-
      Target for the manuscript. preprint (the default) produces a neutral
      working-paper PDF with no journal identification: no "Submitted to ..."
      banner, journal running head, or copyright line (uses the qe layout).
      qe = Quantitative Economics, ecta = Econometrica, te = Theoretical
      Economics each set the econsocart class option, running head, and the
      "Submitted to ..." draft banner.
    default: preprint
    choices:
      - preprint
      - qe
      - ecta
      - te
  - type: boolean
    id: draft
    description: >-
      Proof layout for the submission stage: US Letter, line numbers, increased
      line spacing, and the "Submitted to ..." banner. This is what the three
      journals ask for in a submitted PDF (at least 12pt, at least 1.5 spacing);
      omit it for the camera-ready version, which uses the typeset journal
      layout. All three treat the LaTeX class as optional at submission.
    default: false
  - type: boolean
    id: supplement
    description: Supplementary material document
    default: false
  - type: boolean
    id: seceqn
    description: Number equations by section (e.g., Equation 2.1)
    default: false
  - type: boolean
    id: linenumbers
    description: Display line numbers (useful during review)
    default: false
  - type: string
    id: extra_packages
    description: >-
      Comma-separated LaTeX packages to load, e.g. "mhchem,cancel". For packages
      MyST recognizes but its LaTeX renderer does not auto-inject, so you can use
      them in raw LaTeX blocks without forking the template. Do NOT include soul
      (it clashes with econsocart's \caps).
files:
  - template.tex
  - econsocart.cls
  - econsocart.cfg
  - qe.bst
  - te.bst
  - econsoc.bst
myst: v1
packages:
  - adjustbox
  - algorithm
  - algpseudocode
  - amssymb
  - bm
  - cancel
  - changepage
  - cleveref
  - epigraph
  - etoolbox
  - fontenc
  - hyperref
  - mhchem
  - multirow
  - subcaption
  - supertabular
  - tabularx
  - textcomp
  - threeparttable
  - times
  - url
  - wrapfig
